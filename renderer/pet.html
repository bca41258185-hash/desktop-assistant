<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:;" />
  <title>桌面大師</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">
    <!-- 說話氣泡：描圖紙風格的製圖便箋 -->
    <div id="bubble" class="bubble">
      <img class="bubble-img" alt="" hidden />
      <div class="bubble-text"></div>
      <div class="bubble-attr" hidden></div>
      <div id="bubbleChoices" class="bubble-choices" hidden></div>
      <div id="bubbleTargets" class="bubble-targets" hidden></div>
      <form id="bubbleInput" class="bubble-input" hidden>
        <input type="text" id="bubbleTextInput" autocomplete="off" />
        <button type="submit">送出</button>
      </form>
      <button id="bubbleSkip" class="bubble-skip" hidden>晚點再到 Claude 回答</button>
      <div id="bubbleHint" class="bubble-hint" hidden></div>
    </div>

    <!-- 小狀態標籤：追蹤中的 AI 對話目前在做什麼（進行中／等你確認／完成） -->
    <div id="status" class="status-chip" hidden></div>

    <!-- 隨時對 Claude 說話 -->
    <button id="panelBtn" class="compose-btn panel-btn" title="打開面板（也可以點角色兩下）">📋 面板</button>
    <button id="composeBtn" class="compose-btn" title="對 Claude 說話">✏️ 說話</button>

    <!-- 角色：由 pet.js 依所選大師注入 inline SVG（無外部圖檔） -->
    <div id="pet" class="pet" data-character="ando" data-pose="idle"
         title="點一下：說一句名言・點兩下：打開面板・右鍵：選單">
      <div id="petArt"></div>
    </div>
  </div>

  <script src="characters-philosophers.js"></script>
  <script src="characters.js"></script>
  <script src="pet.js"></script>
</body>
</html>
