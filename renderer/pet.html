<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>桌面夥伴</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">
    <!-- 說話氣泡：描圖紙風格的製圖便箋 -->
    <div id="bubble" class="bubble">
      <div class="bubble-text"></div>
      <div class="bubble-attr" hidden></div>
    </div>

    <!-- 角色：由 pet.js 依所選角色注入 inline SVG（無外部圖檔） -->
    <div id="pet" class="pet" data-character="quokka" data-pose="idle"
         title="拖曳可移動，點一下開啟面板，右鍵說一句話">
      <div id="petArt"></div>
    </div>
  </div>

  <script src="characters.js"></script>
  <script src="pet.js"></script>
</body>
</html>
