<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>stage</title>
<style>
  /* 預告片舞台：1920×1080。
     結構：痛點開場（黑底）→ 標題砸下來 → 四個功能快剪（大數字＋大標語＋放大的助手）→ 三位助手同框鬥嘴 → 片尾。
     助手是真的畫面（iframe 載入 pet-frame.html），其餘是舞台佈景。每個動作用 console.log('SFX:…') 通知錄影程式配音效。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1c1b19; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; color: #2b2b28; }
  #world { position: absolute; inset: 0; overflow: hidden; transform-origin: 62% 70%; transition: transform 0.45s cubic-bezier(.2,.9,.2,1); }
  #world.punch { transform: scale(1.035); transition-duration: 0.09s; }
  #bg {
    position: absolute; inset: 0; background: var(--tint, #f1ede2); transition: background 0.5s ease;
  }
  #bg::after {
    content: ""; position: absolute; inset: -60px;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(60, 60, 50, 0.07) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(60, 60, 50, 0.07) 39px 40px);
    animation: drift 14s linear infinite;
  }
  @keyframes drift { to { transform: translate(40px, 40px); } }

  /* ---------- 痛點開場 ---------- */
  #intro { position: absolute; inset: 0; z-index: 60; background: #1c1b19; color: #f1ede2; transition: opacity 0.18s; }
  #intro.off { opacity: 0; pointer-events: none; }
  #i1 { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 78px; font-weight: 800; letter-spacing: 0.06em; min-height: 100px; }
  #iwin { position: absolute; left: 610px; top: 320px; width: 700px; height: 330px; background: #292826; border-radius: 18px; border: 1px solid #3b3a37; opacity: 0; transition: opacity 0.3s; overflow: hidden; }
  #iwin.on { opacity: 1; }
  #iwin.shake { animation: shake 0.16s linear infinite; }
  @keyframes shake { 25% { transform: translate(-7px, 3px) rotate(-0.6deg); } 75% { transform: translate(7px, -3px) rotate(0.6deg); } }
  #iwin .bar { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #33322f; font-size: 22px; color: #d9d5cb; }
  #iwin .dot { width: 14px; height: 14px; border-radius: 50%; background: #d97757; }
  #iwin .body { padding: 44px 40px; font-size: 40px; color: #cfcabd; display: flex; align-items: center; gap: 22px; }
  .spin { width: 44px; height: 44px; border: 6px solid #55524b; border-top-color: #d97757; border-radius: 50%; animation: rot 0.8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #icount { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 62px; font-weight: 800; color: #f4d98e; opacity: 0; }
  #icount.on { opacity: 1; }
  #icount b { display: inline-block; min-width: 120px; font-size: 130px; color: #ff7a59; vertical-align: -18px; font-variant-numeric: tabular-nums; }
  #icount b.bump { animation: bump 0.12s ease; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  #stamp {
    position: absolute; left: 50%; top: 50%; z-index: 5; font-size: 330px; font-weight: 900; letter-spacing: 0.06em; color: #ff5a3c; white-space: nowrap;
    border: 18px solid #ff5a3c; border-radius: 30px; padding: 10px 70px 26px; background: rgba(28, 27, 25, 0.92);
    transform: translate(-50%, -50%) rotate(-7deg) scale(3.2); opacity: 0;
  }
  #stamp.on { animation: stampIn 0.28s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes stampIn { from { transform: translate(-50%, -50%) rotate(-7deg) scale(3.2); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-7deg) scale(1); opacity: 1; } }

  /* ---------- 標題 ---------- */
  #title { position: absolute; inset: 0; z-index: 30; display: grid; place-content: center; justify-items: center; gap: 18px; pointer-events: none; transition: opacity 0.35s, transform 0.45s cubic-bezier(.5,0,.8,.4); }
  #title.off { opacity: 0; transform: scale(1.5); }
  #title h1 { font-size: 250px; font-weight: 900; letter-spacing: 0.1em; padding-left: 0.1em; display: flex; }
  #title h1 span { display: inline-block; opacity: 0; transform: translateY(-420px) scale(1.5) rotate(-8deg); }
  #title h1 span.on { animation: drop 0.34s cubic-bezier(.2,1.5,.35,1) forwards; }
  @keyframes drop { to { opacity: 1; transform: none; } }
  #title .sub { font-size: 56px; font-weight: 700; letter-spacing: 0.14em; color: #5c5b54; opacity: 0; transform: translateY(26px); transition: all 0.45s cubic-bezier(.2,1.2,.3,1); }
  #title .sub.on { opacity: 1; transform: none; }
  .lineup { display: flex; gap: 6px; align-items: flex-end; margin-top: 14px; }
  .lineup .who { width: 200px; text-align: center; font-size: 28px; font-weight: 700; color: #4a4942; opacity: 0; transform: translateY(260px) scale(0.6); }
  .lineup .who.on { animation: hop 0.5s cubic-bezier(.2,1.6,.3,1) forwards; }
  @keyframes hop { to { opacity: 1; transform: none; } }
  .lineup .who svg { width: 200px; height: 225px; display: block; }
  .lineup .who.on svg { animation: bob 1.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob { 50% { transform: translateY(-9px); } }
  .lineup .think-dots, .lineup .sketch-lines, .lineup .mouth-happy { display: none; }
  .lineup .who svg * { animation: none !important; }

  /* ---------- 角色逐一登場：一人一張大卡 ---------- */
  #cast { position: absolute; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; gap: 60px; background: var(--ctint, #f4f1e9); opacity: 0; pointer-events: none; transition: opacity 0.2s, background 0.25s; }
  #cast.on { opacity: 1; }
  #cast .head { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: 0.24em; color: rgba(43, 43, 40, 0.5); }
  #cast .head b { color: var(--cacc, #d9532b); letter-spacing: 0.08em; margin-left: 18px; }
  #cast .art { width: 600px; height: 675px; flex-shrink: 0; }
  #cast .art svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 22px rgba(50, 40, 20, 0.25)); }
  #cast .art svg * { animation: none !important; }
  #cast .think-dots, #cast .sketch-lines, #cast .mouth-happy { display: none; }
  #cast .info { width: 920px; }
  #cast .ctag { font-size: 62px; font-weight: 800; color: var(--cacc, #d9532b); letter-spacing: 0.08em; }
  #cast .cname { font-size: 250px; font-weight: 900; line-height: 1.08; letter-spacing: 0.06em; white-space: nowrap; }
  #cast .cdesc { font-size: 44px; font-weight: 600; color: #5c5b54; margin-top: 4px; }
  #cast .cline { position: relative; display: inline-block; margin-top: 34px; padding: 20px 30px; font-size: 50px; font-weight: 700; background: #faf8f1; border: 3px solid #d8d2c2; border-radius: 12px; box-shadow: 0 10px 26px rgba(60, 60, 50, 0.2); }
  #cast .cline::before { content: ""; position: absolute; left: -22px; top: 34px; border: 12px solid transparent; border-right-color: #d8d2c2; }
  #cast.play .art { animation: artIn 0.4s cubic-bezier(.2,1.4,.3,1) both; }
  #cast.play .ctag { animation: capIn 0.3s ease 0.05s both; }
  #cast.play .cname { animation: nameIn 0.34s cubic-bezier(.2,1.5,.3,1) 0.08s both; }
  #cast.play .cdesc { animation: capIn 0.3s ease 0.2s both; }
  #cast.play .cline { animation: lineIn 0.34s cubic-bezier(.2,1.6,.3,1) 0.42s both; }
  @keyframes artIn { from { opacity: 0; transform: translateX(-260px) rotate(-10deg) scale(0.7); } }
  @keyframes nameIn { from { opacity: 0; transform: translateX(200px) scale(1.3); } }
  @keyframes lineIn { from { opacity: 0; transform: scale(0.3) rotate(-6deg); } }

  /* ---------- 功能快剪：大數字＋大標語 ---------- */
  #num { position: absolute; left: 70px; top: 14px; z-index: 12; font-size: 300px; font-weight: 900; line-height: 1; color: transparent; -webkit-text-stroke: 5px rgba(43, 43, 40, 0.22); opacity: 0; transform: translateX(-120px); }
  #num.in { animation: slideIn 0.4s cubic-bezier(.2,1.3,.3,1) forwards; }
  #cap { position: absolute; left: 96px; top: 150px; z-index: 13; width: 900px; opacity: 0; }
  #cap.in { animation: capIn 0.42s cubic-bezier(.2,1.3,.3,1) forwards; }
  #cap .big { font-size: 96px; font-weight: 900; line-height: 1.18; letter-spacing: 0.02em; }
  #cap .big em { font-style: normal; color: var(--accent, #d9532b); }
  #cap .sub { margin-top: 12px; font-size: 38px; font-weight: 600; color: #5c5b54; }
  @keyframes slideIn { to { opacity: 1; transform: none; } }
  @keyframes capIn { from { opacity: 0; transform: translateY(60px) scale(0.92); } to { opacity: 1; transform: none; } }
  #num.out, #cap.out { opacity: 0 !important; transition: opacity 0.18s; animation: none; }

  /* 前景：使用者自己在做的事（繪圖軟體）。重點是「人不在 Claude 那個視窗」 */
  #workwin { position: absolute; left: 96px; top: 560px; width: 820px; height: 400px; z-index: 11; background: #fdfcf8; border-radius: 16px; border: 2px solid #c9c4b6; box-shadow: 0 26px 70px rgba(50, 40, 20, 0.32); overflow: hidden; opacity: 0; transform: translateY(80px); transition: opacity 0.4s, transform 0.5s cubic-bezier(.2,1.2,.3,1); }
  #workwin.on { opacity: 1; transform: none; }
  #workwin .bar { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: #e7e2d4; color: #3a3a36; font-size: 23px; font-weight: 700; }
  #workwin .bar .here { margin-left: auto; font-size: 20px; font-weight: 700; color: #1f7a3f; background: #dcefdf; border-radius: 999px; padding: 3px 14px; }
  #workwin .bar .here::before { content: "●"; margin-right: 6px; font-size: 13px; vertical-align: 2px; }
  #workwin svg { display: block; width: 100%; height: 352px; }
  #plan path, #plan rect, #plan line { fill: none; stroke: #2b2b28; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 7s linear infinite; }
  #plan .thin { stroke-width: 2; stroke: #8a887d; }
  #plan .d2 { animation-delay: -1.2s; } #plan .d3 { animation-delay: -2.4s; } #plan .d4 { animation-delay: -3.6s; } #plan .d5 { animation-delay: -4.8s; }
  @keyframes draw { 0% { stroke-dashoffset: 1; } 45%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }

  /* 工作列：Claude 只是一顆在背景跑的圖示，不在眼前 */
  #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 66px; z-index: 25; background: #26251f; display: flex; align-items: center; gap: 10px; padding: 0 28px; transform: translateY(70px); transition: transform 0.45s cubic-bezier(.2,1.2,.3,1); }
  #taskbar.on { transform: none; }
  .tb { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-radius: 10px; font-size: 22px; color: #cfcabd; position: relative; white-space: nowrap; }
  .tb.active { background: #3b3a33; color: #fff; }
  .tb.active::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 2px; height: 4px; border-radius: 2px; background: #7fb0ff; }
  .tb .ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 18px; }
  .tb .ico.cl { background: #d97757; color: #fff; font-weight: 800; }
  .tb .st { width: 13px; height: 13px; border-radius: 50%; background: #6b6a62; }
  .tb.working .st { background: #6aa7ff; animation: pulse 0.9s ease-in-out infinite; }
  .tb.waiting { background: #5a431c; color: #ffe2a8; animation: tbBlink 0.7s steps(2) infinite; }
  .tb.waiting .st { background: #ffb347; }
  .tb.done .st { background: #63c27c; }
  .tb.gone { display: none; }
  .tb small { font-size: 18px; color: #8f8a7d; margin-left: 4px; }
  .tb.waiting small { color: #ffd98a; }
  @keyframes tbBlink { 50% { background: #7a5a22; } }
  @keyframes pulse { 50% { opacity: 0.2; } }
  #toast { position: absolute; left: 420px; bottom: 82px; z-index: 26; background: #26251f; color: #9ad0a4; font-size: 24px; padding: 10px 20px; border-radius: 12px; opacity: 0; transform: translateY(14px); transition: opacity 0.25s, transform 0.25s; white-space: nowrap; }
  #toast.on { opacity: 1; transform: none; }

  /* ---------- 助手 ---------- */
  .petframe { position: absolute; width: 520px; height: 640px; border: 0; background: transparent; z-index: 20; transform-origin: 50% 100%; left: 0; top: 0; opacity: 0; transition: translate 0.6s cubic-bezier(.2,1.25,.3,1), scale 0.6s cubic-bezier(.2,1.25,.3,1), opacity 0.25s; }
  .petframe.on { opacity: 1; }
  /* translate 定位的是 iframe 左上角；scale 以底部中央為基準 */
  .petframe.hide { translate: 1180px 1400px; scale: 1.3; }
  .petframe.hero { translate: 1180px 368px; scale: 1.7; }
  .petframe.a { translate: 140px 368px; scale: 1.68; }
  .petframe.b { translate: 700px 368px; scale: 1.68; }
  .petframe.c { translate: 1260px 368px; scale: 1.68; }

  /* ---------- 特效 ---------- */
  #flash { position: absolute; inset: 0; z-index: 70; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash 0.32s ease-out; }
  @keyframes flash { from { opacity: 0.85; } to { opacity: 0; } }
  .bit { position: absolute; z-index: 45; width: 22px; height: 12px; border-radius: 3px; pointer-events: none; animation: fly 1s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
  .pow { position: absolute; z-index: 46; white-space: nowrap; font-size: 130px; font-weight: 900; color: var(--c, #3f8f55); -webkit-text-stroke: 8px #fff; paint-order: stroke fill; pointer-events: none; animation: pow 0.9s cubic-bezier(.2,1.5,.3,1) forwards; }
  @keyframes pow { 0% { transform: translate(-50%, -50%) scale(0.2) rotate(-12deg); opacity: 0; } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-8deg); } 75% { opacity: 1; transform: translate(-50%, -62%) scale(1) rotate(-8deg); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1) rotate(-8deg); } }
  #cursor { position: absolute; left: 1300px; top: 1250px; z-index: 55; width: 58px; height: 58px; transition: left 0.55s cubic-bezier(.3,.8,.2,1), top 0.55s cubic-bezier(.3,.8,.2,1); pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35)); }
  #cursor.click { animation: click 0.2s ease; }
  @keyframes click { 50% { transform: scale(0.7); } }

  /* ---------- 三位同框的大標 ---------- */
  #multi { position: absolute; left: 0; right: 0; top: 70px; z-index: 14; text-align: center; opacity: 0; }
  #multi.in { animation: capIn 0.42s cubic-bezier(.2,1.3,.3,1) forwards; }
  #multi .big { font-size: 110px; font-weight: 900; letter-spacing: 0.04em; }
  #multi .big em { font-style: normal; color: #2f6fd0; }
  #multi .sub { font-size: 44px; font-weight: 600; color: #5c5b54; margin-top: 8px; }
  #multi.out { opacity: 0 !important; transition: opacity 0.2s; animation: none; }

  /* ---------- 片尾 ---------- */
  #end { position: absolute; inset: 0; z-index: 40; display: grid; place-content: center; justify-items: center; gap: 20px; opacity: 0; pointer-events: none; }
  #end.on { opacity: 1; }
  #end h1 { font-size: 170px; font-weight: 900; letter-spacing: 0.12em; padding-left: 0.12em; opacity: 0; transform: scale(0.6); }
  #end.on h1 { animation: hop 0.5s cubic-bezier(.2,1.5,.3,1) 1.5s forwards; }
  #end .tag { font-size: 54px; font-weight: 700; letter-spacing: 0.1em; color: #5c5b54; opacity: 0; }
  #end.on .tag { animation: capIn 0.45s ease 2.1s forwards; }
  #end .cta { margin-top: 8px; padding: 20px 66px; font-size: 50px; font-weight: 800; color: #fff; background: #d9532b; border-radius: 999px; letter-spacing: 0.1em; opacity: 0; }
  #end.on .cta { animation: capIn 0.45s cubic-bezier(.2,1.4,.3,1) 2.7s forwards, throb 1s ease-in-out 3.3s infinite; }
  @keyframes throb { 50% { transform: scale(1.06); } }
  #end .url { font-size: 32px; color: #7a7a70; letter-spacing: 0.04em; opacity: 0; }
  #end.on .url { animation: capIn 0.45s ease 3.2s forwards; }
</style>
</head>
<body>
<div id="world">
  <div id="bg"></div>

  <div id="title" class="off">
    <h1><span>桌</span><span>面</span><span>大</span><span>師</span></h1>
    <div class="sub">請幾位古人，幫你盯著 Claude</div>
    <div class="lineup" id="lineup1"></div>
  </div>

  <div id="cast"><div class="head">六位古人，任你選<b id="castNo"></b></div><div class="art" id="castArt"></div><div class="info" id="castInfo"></div></div>

  <div id="num"></div>
  <div id="cap"></div>
  <div id="multi"></div>

  <div id="workwin">
    <div class="bar">📐 平面圖.dwg — 繪圖軟體<span class="here">你在這裡工作</span></div>
    <svg id="plan" viewBox="0 0 820 352">
      <rect class="thin" pathLength="1" x="0" y="0" width="820" height="352" style="stroke-dasharray:none;stroke-dashoffset:0;animation:none;stroke:#eee9dc;fill:#fdfcf8"/>
      <path pathLength="1" d="M90 60 H520 V300 H90 Z"/>
      <path pathLength="1" class="d2" d="M300 60 V190 M300 230 V300"/>
      <path pathLength="1" class="d3" d="M520 150 H730 V300 H520"/>
      <path pathLength="1" class="d4 thin" d="M300 190 A40 40 0 0 1 340 230"/>
      <path pathLength="1" class="d5 thin" d="M130 330 H480 M130 322 V338 M480 322 V338"/>
      <path pathLength="1" class="d3 thin" d="M150 100 H250 V160 H150 Z M360 110 H470 V200 H360 Z"/>
      <path pathLength="1" class="d5 thin" d="M600 190 H680 V260 H600 Z"/>
    </svg>
  </div>

  <div id="taskbar">
    <div class="tb"><span class="ico">🪟</span></div>
    <div class="tb active"><span class="ico">📐</span>繪圖軟體</div>
    <div class="tb" id="tb1"><span class="ico cl">C</span>Claude<span class="st"></span><small id="tb1t">在背景</small></div>
    <div class="tb gone" id="tb2"><span class="ico cl">C</span>Claude<span class="st"></span><small id="tb2t"></small></div>
    <div class="tb gone" id="tb3"><span class="ico cl">C</span>Claude<span class="st"></span><small id="tb3t"></small></div>
  </div>
  <div id="toast"></div>

  <iframe id="p1" class="petframe hide" src="pet-frame.html?char=mozi"></iframe>
  <iframe id="p2" class="petframe hide" src="pet-frame.html?char=zhuangzi"></iframe>
  <iframe id="p3" class="petframe hide" src="pet-frame.html?char=hanfeizi"></iframe>

  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 15 L11.6 22 L14.4 20.8 L11.4 14 L18 14 Z" fill="#fff" stroke="#1d1d1d" stroke-width="1.4" stroke-linejoin="round"/></svg>

  <div id="end">
    <div class="lineup" id="lineup2"></div>
    <h1>桌面大師</h1>
    <div class="tag">Claude 在背景跑，你不用一直切回去看</div>
    <div class="cta">Windows 免費下載</div>
    <div class="url">github.com/bca41258185-hash/desktop-assistant</div>
  </div>

  <div id="intro">
    <div id="i1"></div>
    <div id="iwin"><div class="bar"><span class="dot"></span>Claude</div><div class="body"><span class="spin"></span>正在處理你的要求…</div></div>
    <div id="icount">你切回 Claude 看了 <b id="icn">0</b> 次</div>
    <div id="stamp">別看了</div>
  </div>
  <div id="flash"></div>
</div>

<script src="../renderer/characters-philosophers.js"></script>
<script src="../renderer/characters.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const sfx = (name) => console.log('SFX:' + name);       // 錄影程式會記下時間，之後照時間配音效

// 兩排六位角色（標題與片尾）
const CAST = ['confucius', 'laozi', 'zhuangzi', 'mozi', 'hanfeizi', 'guiguzi'];
['lineup1', 'lineup2'].forEach((lid) => CAST.forEach((id, i) => {
  const c = window.CHARACTERS[id];
  const d = document.createElement('div');
  d.className = 'who';
  d.style.setProperty('--d', (i * 0.13) + 's');
  d.innerHTML = c.svg + '<div>' + c.nameZh + '</div>';
  $(lid).appendChild(d);
}));

const pet = (n) => $('p' + n).contentWindow.petCtl;
const pdoc = (n) => $('p' + n).contentDocument;
function place(n, cls) { const f = $('p' + n); f.className = 'petframe on ' + cls; }

function tint(color, accent) {
  $('bg').style.setProperty('--tint', color);
  document.body.style.setProperty('--accent', accent || '#d9532b');
}
function feature(no, big, sub) {
  for (const id of ['num', 'cap']) { $(id).className = 'out'; }
  setTimeout(() => {
    $('num').textContent = no;
    $('cap').innerHTML = '<div class="big">' + big + '</div><div class="sub">' + sub + '</div>';
    $('num').className = 'in';
    $('cap').className = 'in';
    punch();
    sfx('whoosh');
  }, 200);
}
// 工作列上 Claude 圖示的狀態（它在背景，不在畫面上）
function claude(n, cls, text) {
  const b = $('tb' + n);
  b.className = 'tb ' + (cls || '');
  $('tb' + n + 't').textContent = text || '';
}
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  sfx('pop');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('on'), 1900);
}
function flash() { const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function punch() { $('world').classList.add('punch'); setTimeout(() => $('world').classList.remove('punch'), 110); }
function confetti(x, y, n) {
  const colors = ['#d9532b', '#f4b63f', '#3f8f55', '#2f6fd0', '#b05bd6', '#ff7a59'];
  for (let i = 0; i < (n || 34); i++) {
    const b = document.createElement('div');
    b.className = 'bit';
    const ang = Math.random() * Math.PI * 2;
    const dist = 220 + Math.random() * 520;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.background = colors[i % colors.length];
    b.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    b.style.setProperty('--dy', (Math.sin(ang) * dist - 160) + 'px');
    b.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
    $('world').appendChild(b);
    setTimeout(() => b.remove(), 1100);
  }
}
function pow(text, x, y, color) {
  const p = document.createElement('div');
  p.className = 'pow';
  p.textContent = text;
  p.style.left = x + 'px'; p.style.top = y + 'px';
  p.style.setProperty('--c', color || '#3f8f55');
  $('world').appendChild(p);
  setTimeout(() => p.remove(), 950);
}

// 把假滑鼠移到助手畫面裡的某個元素上（依 iframe 目前的位置與放大倍率換算）
function spot(n, el, fx, fy) {
  const fr = $('p' + n).getBoundingClientRect();
  const k = fr.width / 520;
  const r = el.getBoundingClientRect();
  return { x: fr.left + (r.left + r.width * (fx === undefined ? 0.5 : fx)) * k, y: fr.top + (r.top + r.height * (fy === undefined ? 0.55 : fy)) * k };
}
async function pointAt(n, sel, fx) {
  const el = typeof sel === 'string' ? pdoc(n).querySelector(sel) : sel;
  const p = spot(n, el, fx);
  $('cursor').style.left = (p.x - 8) + 'px';
  $('cursor').style.top = (p.y - 6) + 'px';
  await sleep(620);
  return { el, p };
}
async function clickAt(n, sel) {
  const { el, p } = await pointAt(n, sel);
  $('cursor').classList.add('click');
  sfx('click');
  await sleep(110);
  el.click();
  punch();
  setTimeout(() => $('cursor').classList.remove('click'), 200);
  return p;
}
function parkCursor() { $('cursor').style.left = (380 + Math.random() * 300) + 'px'; $('cursor').style.top = (700 + Math.random() * 160) + 'px'; }

async function typeInto(el, text, gap) {
  for (const ch of text) { el.textContent += ch; sfx('type'); await sleep(gap || 70); }
}

// 六位角色的介紹卡：個性標籤、一句說明、一句他會說的話（都是 app 裡的原創台詞）
const CASTINFO = [
  ['confucius', '溫和的老師', '會誇你，也會提醒你慢慢來', '知道哪裡不好就改，這很難得。', '#f6ecd9', '#b0661c'],
  ['laozi', '話最少的那位', '相信少做一點，事情反而順', '讓它自己跑，別去攪它。', '#e6efe9', '#3d7d62'],
  ['zhuangzi', '逍遙的夢想家', '愛說寓言，勸你放輕鬆', '放輕鬆，路比你想的寬。', '#e8f1df', '#4f8a3a'],
  ['mozi', '實幹的工匠', '凡事問有沒有用，量過才算數', '光說沒用，做出來能用才算數。', '#f3e8d8', '#9a5a2a'],
  ['hanfeizi', '冷面法家', '只信規則和證據，話短但到位', '別靠運氣。運氣不是辦法。', '#f3dedb', '#b0352b'],
  ['guiguzi', '山中的謀略家', '先觀察、等時機，再開口', '時機沒到，說什麼都是多的。', '#e3e8ee', '#44525a']
];
async function castIntro() {
  const box = $('cast');
  for (let i = 0; i < CASTINFO.length; i++) {
    const [id, tag, desc, line, tintColor, acc] = CASTINFO[i];
    const c = window.CHARACTERS[id];
    box.style.setProperty('--ctint', tintColor);
    box.style.setProperty('--cacc', acc);
    $('castNo').textContent = (i + 1) + ' / ' + CASTINFO.length;
    $('castArt').innerHTML = c.svg;
    $('castInfo').innerHTML = '<div class="ctag">' + tag + '</div><div class="cname">' + c.nameZh + '</div><div class="cdesc">' + desc + '</div><div class="cline">「' + line + '」</div>';
    box.classList.remove('play'); void box.offsetWidth; box.classList.add('play', 'on');
    sfx('thump');
    punch();
    await sleep(430);
    sfx(i % 2 ? 'talkB' : 'talkA');
    await sleep(1320);
  }
}

async function run() {
  await sleep(500);
  document.title = 'GO';                       // 通知錄影程式：開始
  sfx('start');

  // ================= 痛點開場 =================
  await sleep(350);
  await typeInto($('i1'), '你叫 Claude 做事，自己去忙別的。', 62);
  await sleep(250);
  $('iwin').classList.add('on');
  sfx('pop');
  await sleep(900);
  $('i1').textContent = '';
  await typeInto($('i1'), '結果呢？', 90);
  await sleep(350);
  $('icount').classList.add('on');
  $('iwin').classList.add('shake');
  // 計數器越跳越快
  let n = 0;
  for (let gap = 300; n < 27; gap = Math.max(45, gap * 0.86)) {
    n += 1;
    $('icn').textContent = n;
    $('icn').classList.remove('bump'); void $('icn').offsetWidth; $('icn').classList.add('bump');
    sfx('tick');
    await sleep(gap);
  }
  await sleep(200);
  $('iwin').classList.remove('shake');
  $('stamp').classList.add('on');
  sfx('thump');
  punch();
  await sleep(1150);

  // ================= 標題 =================
  sfx('drop');                                  // 音樂從這裡進節奏
  flash();
  tint('#f4f1e9');
  $('intro').classList.add('off');
  $('title').classList.remove('off');
  const letters = $('title').querySelectorAll('h1 span');
  for (const el of letters) { el.classList.add('on'); sfx('thump'); await sleep(250); }
  await sleep(150);
  $('title').querySelector('.sub').classList.add('on');
  sfx('whoosh');
  await sleep(350);
  for (const el of $('lineup1').children) { el.classList.add('on'); sfx('pop'); await sleep(125); }
  await sleep(1100);

  // ================= 六位角色逐一登場 =================
  await castIntro();
  flash();
  $('cast').classList.remove('on', 'play');

  // ================= 01 他幫你盯著 =================
  $('title').classList.add('off');
  tint('#f6efdc', '#d9532b');
  feature('01', '你在別的視窗工作，<br><em>他幫你盯著 Claude</em>', 'Claude 在背景跑，不用切過去看');
  $('workwin').classList.add('on');
  $('taskbar').classList.add('on');
  parkCursor();
  await sleep(450);
  place(1, 'hero');
  sfx('boing');
  await sleep(550);
  claude(1, 'working', '整理報告中…');
  await sleep(600);
  pet(1).status({ text: '進行中', cls: 'working' });
  pet(1).pose('think');
  pet(1).speak({ text: 'Claude 開始處理了', attribution: '你說：幫我整理期末報告的格式', ai: true, duration: 2300 });
  sfx('ding');
  await sleep(2500);
  pet(1).pose('idle');
  pet(1).speak({ text: '跑一次、驗一次。木匠也是拿尺量過才下鋸。', duration: 2400 });
  sfx('pop');
  await sleep(2500);

  // ================= 02 要你同意？按一下 =================
  tint('#fdf0d2', '#c9781a');
  feature('02', '它要你同意？<br><em>不用切視窗</em>', '在泡泡上按一下，繼續畫你的圖');
  parkCursor();
  await sleep(500);
  claude(1, 'waiting', '等你同意');
  pet(1).status({ text: '等你回答', cls: 'waiting' });
  pet(1).speak({
    text: 'Claude 想修改檔案「期末報告.docx」，要讓它改嗎？', ai: true, sticky: true, action: 'choice', requestId: 'r1',
    choices: [{ id: 'allow', label: '允許' }, { id: 'deny', label: '拒絕' }],
    inputLabel: '不同意？打字告訴 Claude 要怎麼改：', inputPlaceholder: '打字告訴 Claude…', inputButton: '拒絕並送出'
  });
  sfx('alert');
  await sleep(1700);
  const hit1 = await clickAt(1, '.bubble-choice.allow');
  flash(); confetti(hit1.x, hit1.y); pow('允許！', hit1.x, hit1.y - 60, '#3f8f55');
  sfx('yes');
  toast('✓ 已允許，Claude 繼續做');
  claude(1, 'working', '整理報告中…');
  setTimeout(parkCursor, 500);
  pet(1).status({ text: '進行中', cls: 'working' });
  pet(1).pose('happy');
  await sleep(1900);

  // ================= 03 問你問題？直接答 =================
  tint('#e9f1e4', '#2f8a4f');
  feature('03', '它問你問題？<br><em>原地回答</em>', '選項直接出現在泡泡上');
  parkCursor();
  pet(1).pose('idle');
  await sleep(500);
  claude(1, 'waiting', '有問題問你');
  pet(1).status({ text: '等你回答', cls: 'waiting' });
  pet(1).speak({
    text: '報告要用哪一種格式交？', ai: true, sticky: true, action: 'choice', requestId: 'r2',
    choices: [{ id: 'opt0', label: 'Word 檔' }, { id: 'opt1', label: 'PDF' }, { id: 'opt2', label: '簡報' }]
  });

  await sleep(1500);
  const hit2 = await clickAt(1, pdoc(1).querySelectorAll('.bubble-choice')[1]);
  flash(); pow('PDF！', hit2.x, hit2.y - 60, '#2f6fd0');
  sfx('yes');
  toast('✓ 已回答：PDF');
  claude(1, 'working', '整理報告中…');
  setTimeout(parkCursor, 500);
  pet(1).status({ text: '進行中', cls: 'working' });
  await sleep(1600);

  // ================= 04 做完叫你，還能回話 =================
  tint('#e4eefb', '#2f6fd0');
  feature('04', '做完會叫你，<br><em>還能直接回話</em>', '打字就是下一個指令，還是不用切視窗');
  parkCursor();
  await sleep(450);
  claude(1, 'done', '做完了');
  pet(1).status({ text: '完成', cls: 'done' });
  pet(1).pose('happy');
  pet(1).speak({ text: '格式整理好了，已經存成 PDF。', ai: true, sticky: true, action: 'confirm', composeTo: 's1', inputPlaceholder: '回覆 Claude…' });
  sfx('fanfare');
  const fr = $('p1').getBoundingClientRect();
  confetti(fr.left + fr.width / 2, fr.top + fr.height * 0.45, 46);
  flash();
  await sleep(1500);
  const { el: input } = await pointAt(1, '#bubbleTextInput', 0.2);

  for (const ch of '再幫我加上頁碼') { input.value += ch; sfx('type'); await sleep(105); }
  await sleep(250);
  const hit3 = await pointAt(1, '#bubbleSend');
  $('cursor').classList.add('click'); sfx('click'); punch();
  await sleep(120);
  $('cursor').classList.remove('click');
  pdoc(1).getElementById('bubble').click();
  pow('送出！', hit3.p.x - 240, hit3.p.y - 90, '#d9532b');
  sfx('send');
  toast('已送給 Claude：再幫我加上頁碼');
  claude(1, 'working', '加頁碼中…');
  setTimeout(parkCursor, 500);
  pet(1).status({ text: '進行中', cls: 'working' });
  pet(1).pose('idle');
  await sleep(1500);

  // ================= 三位同框 =================
  for (const id of ['num', 'cap']) $(id).className = 'out';
  $('workwin').classList.remove('on');
  $('cursor').style.top = '1300px';
  claude(1, '', ''); claude(2, '', ''); claude(3, '', '');
  tint('#f3e9f7', '#2f6fd0');
  pet(1).status({ text: '', cls: '' });
  place(1, 'b');
  await sleep(200);
  $('multi').innerHTML = '<div class="big">背景跑三個對話？<em>三位助手</em></div><div class="sub">一個對話一位，誰的事一眼就知道</div>';
  $('multi').className = 'in';
  sfx('whoosh');
  await sleep(300);
  place(2, 'a'); sfx('boing');
  await sleep(260);
  place(3, 'c'); sfx('boing');
  await sleep(550);
  pet(2).status({ text: '完成', cls: 'done' }); claude(1, 'done', '簡報：做完了'); sfx('pop');
  await sleep(230);
  pet(1).status({ text: '進行中', cls: 'working' }); claude(2, 'working', '報告：進行中'); sfx('pop');
  await sleep(230);
  pet(3).status({ text: '等你回答', cls: 'waiting' }); claude(3, 'waiting', '考題：等你回答'); sfx('pop');
  await sleep(1500);

  // ---- 沒事的時候，他們會鬥嘴 ----
  $('multi').className = 'out';
  await sleep(220);
  $('multi').innerHTML = '<div class="big">沒事的時候，<em>他們會鬥嘴</em></div>';
  $('multi').className = 'in';
  sfx('whoosh');
  [1, 2, 3].forEach((k) => { pet(k).status({ text: '', cls: '' }); claude(k, '', k === 1 ? '在背景' : ''); });
  $('tb2').classList.add('gone'); $('tb3').classList.add('gone');
  await sleep(700);
  const chat = [
    [1, '莊先生，你今天做了什麼有用的事？', 1750],
    [2, '我看了一下午的雲。', 1350],

    [2, '不能，但看了心情好。', 1500]
  ];
  for (const [k, text, hold] of chat) {
    pet(k).speak({ text, chat: true, duration: hold + 900 });
    sfx(k === 1 ? 'talkA' : 'talkB');
    await sleep(hold);
  }
  pet(3).speak({ text: '……上班時間，安靜。', chat: true, duration: 2600 });
  sfx('sting');
  punch();
  await sleep(450);
  pet(1).pose('think'); pet(2).pose('think');
  await sleep(1900);

  // ================= 片尾 =================
  sfx('end');
  flash();
  $('multi').className = 'out';
  [1, 2, 3].forEach((k) => { $('p' + k).className = 'petframe hide'; });
  $('taskbar').classList.remove('on');
  tint('#f4f1e9');
  $('end').classList.add('on');
  await sleep(120);
  for (const el of $('lineup2').children) { el.classList.add('on'); sfx('pop'); await sleep(140); }
  await sleep(480);
  sfx('thump');
  await sleep(1200);
  sfx('yes');
  await sleep(3600);
  document.title = 'END';                      // 通知錄影程式：結束
}
window.addEventListener('load', () => setTimeout(run, 900));
</script>
