<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>庫卡助理</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 頭像用的圖庫：每隻畫一次，名單和清單用 <use> 引用 -->
  <svg id="avatarSprite" class="sprite" aria-hidden="true" focusable="false"><defs id="avatarDefs"></defs></svg>

  <header class="topbar">
    <h1 class="title">庫卡助理</h1>
    <button type="button" class="icon-btn" id="globalGear" aria-label="全部庫卡的設定" aria-expanded="false" title="設定">⚙</button>
  </header>

  <!-- 庫卡名單 -->
  <nav class="roster" id="roster" aria-label="庫卡名單"></nav>

  <!-- 全域設定 -->
  <section class="sheet" id="globalSheet" hidden aria-label="全部庫卡的設定"></section>

  <main class="main" id="main">
    <!-- 輸入框 -->
    <section class="composer" id="composer">
      <div class="input-wrap">
        <input type="text" id="addInput" maxlength="200" autocomplete="off" spellcheck="false"
               aria-describedby="addHint" />
      </div>
      <div class="hint-row">
        <p class="add-hint" id="addHint" aria-live="polite"></p>
        <button type="button" class="link-btn" id="switchType" hidden></button>
      </div>
    </section>

    <!-- 新增庫卡、⚙（每隻）的卡片會放在這裡 -->
    <section id="cardSlot"></section>

    <!-- 清單 -->
    <section id="lists" class="lists"></section>
  </main>

  <footer class="footer" id="footer">
    <div class="owner-line" id="ownerLine"></div>
    <div class="play-row" id="playRow" role="group" aria-label="陪我玩"></div>
    <p class="disclaimer" id="disclaimer" hidden>僅供參考，不是投資建議；資料可能延遲</p>
  </footer>

  <!-- 刪除後的「復原」 -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <!-- 右鍵選單「交給…」 -->
  <div class="menu" id="menu" role="menu" hidden></div>
  <!-- 響鈴念給螢幕報讀器聽 -->
  <div class="sr-only" id="announcer" aria-live="assertive"></div>

  <script src="traits.js"></script>
  <script src="quokka-acc.js"></script>
  <script src="quokka-art.js"></script>
  <script src="quokka-pose.js"></script>
  <script src="../lib/parse-input.js"></script>
  <script src="panel.js"></script>
</body>
</html>
